name: Build Windows EXE (2016 Source)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Boost Headers
        uses: actions/cache@v4
        with:
          path: third_party/boost
          key: win-boost-1.58.0-v1

      - name: Download & Extract Boost Headers (1.58.0)
        shell: pwsh
        run: |
          if (-not (Test-Path "third_party/boost/boost")) {
            New-Item -ItemType Directory -Force -Path "third_party/boost" | Out-Null
            curl.exe -sL "https://archives.boost.io/release/1.58.0/source/boost_1_58_0.tar.bz2" -o "boost.tar.bz2"
            tar.exe -xjf "boost.tar.bz2" -C "third_party/boost" --strip-components=1 "boost_1_58_0/boost"
            Remove-Item -Force "boost.tar.bz2"
          }

      - name: Setup Visual Studio Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows Project
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $boostInc = "$root\third_party\boost"

          # Localiza headers ATL/MFC dentro do MSVC para corrigir 'atlbase.h'
          $atlInc = @()
          if ($env:VCToolsInstallDir) {
            Get-ChildItem -Path $env:VCToolsInstallDir -Filter "atlbase.h" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              $dir = Split-Path $_.FullName
              if ($dir -notin $atlInc) { $atlInc += $dir }
            }
          }

          $extraInc = @($boostInc, $root, "$root\App\include", "$root\ClientShared", "$root\Log\include", "$root\Rendering\G3D\include", "$root\Network\include") + $atlInc
          $env:INCLUDE = (($extraInc -join ";") + ";" + $env:INCLUDE)

          # Detecta PlatformToolset e WindowsTargetPlatformVersion
          $toolset = "v143"
          if ($env:VCToolsVersion) {
            $major = [int]($env:VCToolsVersion.Split('.')[0])
            if ($major -ge 144) { $toolset = "v145" }
            elseif ($major -eq 143) { $toolset = "v143" }
          }

          $winSdkRoot = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdkVer = "10.0.22621.0"
          if (Test-Path $winSdkRoot) {
            $latestSdk = Get-ChildItem -Path $winSdkRoot -Directory |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
              Sort-Object Name -Descending |
              Select-Object -First 1
            if ($latestSdk) { $sdkVer = $latestSdk.Name }
          }

          $allSlns = Get-ChildItem -Path . -Filter "*.sln" -Recurse -Depth 5
          $sln = $allSlns | Where-Object { $_.Name -notmatch "CSharp" -and $_.Name -match "Client" } | Select-Object -First 1
          if (-not $sln) {
            $sln = $allSlns | Select-Object -First 1
          }

          if ($sln) {
            Write-Host "Compilando Solution: $($sln.FullName)"
            $slnContent = Get-Content -Path $sln.FullName -Raw
            $configs = [regex]::Matches($slnContent, '^\s*(Debug|Release)\|([^=\r\n]+)\s*=', 'Multiline') |
              ForEach-Object { "$($_.Groups[1].Value)|$($_.Groups[2].Value.Trim())" } |
              Select-Object -Unique

            $chosen = $configs | Where-Object { $_ -match "^Release\|(Win32|x64|x86)$" } | Select-Object -First 1
            if (-not $chosen) { $chosen = $configs | Where-Object { $_ -match "^Release\|" } | Select-Object -First 1 }
            if (-not $chosen) { $chosen = $configs | Select-Object -First 1 }

            $cfg = "Release"
            $plat = "Win32"
            if ($chosen) {
              $parts = $chosen.Split('|', 2)
              $cfg = $parts[0]
              $plat = $parts[1]
            }

            Write-Host "Usando Configuration='$cfg', Platform='$plat', Toolset='$toolset', SDK='$sdkVer'"

            # Compila projetos principais individualmente se existirem (evita falhas em PrepForUpload / UnitTest)
            $targetProjects = @(
              "WindowsClient\WindowsClient.vcxproj",
              "RobloxStudio\RobloxStudio.vcxproj",
              "App\App.vcxproj",
              "Network\Network.vcxproj"
            ) | Where-Object { Test-Path (Join-Path $root $_) }

            if ($targetProjects.Count -gt 0) {
              foreach ($proj in $targetProjects) {
                $fullProj = Join-Path $root $proj
                Write-Host "Compilando projeto: $fullProj"
                msbuild.exe "$fullProj" `
                  "/p:Configuration=$cfg" `
                  "/p:Platform=$plat" `
                  "/p:PlatformToolset=$toolset" `
                  "/p:WindowsTargetPlatformVersion=$sdkVer" `
                  "/p:PostBuildEventUseInBuild=false" `
                  "/p:PreBuildEventUseInBuild=false" `
                  /maxCpuCount:1 `
                  /p:WarningLevel=0 `
                  /p:TreatWarningsAsErrors=false
              }
            } else {
              msbuild.exe "$($sln.FullName)" `
                "/p:Configuration=$cfg" `
                "/p:Platform=$plat" `
                "/p:PlatformToolset=$toolset" `
                "/p:WindowsTargetPlatformVersion=$sdkVer" `
                "/p:PostBuildEventUseInBuild=false" `
                "/p:PreBuildEventUseInBuild=false" `
                /maxCpuCount:1 `
                /p:WarningLevel=0 `
                /p:TreatWarningsAsErrors=false
            }
          } else {
            $cmake = Get-ChildItem -Path . -Filter "CMakeLists.txt" -Recurse -Depth 5 | Select-Object -First 1
            if (-not $cmake) {
              Write-Error "Nenhum arquivo .sln ou CMakeLists.txt encontrado no repositório."
              exit 1
            }
            $srcDir = Split-Path $cmake.FullName
            $buildDir = "$root\build_win"
            New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
            cmake.exe -S "$srcDir" -B "$buildDir" -A x64 `
              -DCMAKE_CXX_FLAGS="/I`"$boostInc`" /permissive /w" `
              -DCMAKE_C_FLAGS="/I`"$boostInc`" /w"
            cmake.exe --build "$buildDir" --config Release --parallel 1
          }

      - name: Upload Built Windows Binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-release
          path: |
            **/*.exe
            **/*.dll
            !**/vcpkg/**
            !**/third_party/**
          if-no-files-found: error
