name: Build Android APK (2016 Source)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK 26
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Download & Extract Boost Headers (1.58.0)
        run: |
          mkdir -p third_party/boost
          curl -L https://archives.boost.io/release/1.58.0/source/boost_1_58_0.tar.bz2 -o boost.tar.bz2
          tar -xjf boost.tar.bz2 -C third_party/boost --strip-components=1 boost_1_58_0/boost
          rm boost.tar.bz2

      - name: Fix Linux Case-Sensitivity Symlinks
        run: |
          # Cria links simbólicos para pastas em minúsculo que o código C++ inclui com maiúsculas
          [ -d "App/include/v8tree" ] && [ ! -e "App/include/V8Tree" ] && ln -s v8tree App/include/V8Tree || true
          [ -d "App/include/util" ] && [ ! -e "App/include/Util" ] && ln -s util App/include/Util || true
          [ -d "App/include/reflection" ] && [ ! -e "App/include/Reflection" ] && ln -s reflection App/include/Reflection || true
          [ -d "App/include/rbx" ] && [ ! -e "App/include/Rbx" ] && ln -s rbx App/include/Rbx || true
          [ -d "App/include/v8datamodel" ] && [ ! -e "App/include/V8DataModel" ] && ln -s v8datamodel App/include/V8DataModel || true
          [ -d "App/include/v8world" ] && [ ! -e "App/include/V8World" ] && ln -s v8world App/include/V8World || true
          [ -d "App/include/v8xml" ] && [ ! -e "App/include/V8Xml" ] && ln -s v8xml App/include/V8Xml || true
          [ -d "App/include/security" ] && [ ! -e "App/include/Security" ] && ln -s security App/include/Security || true
          [ -d "App/include/script" ] && [ ! -e "App/include/Script" ] && ln -s script App/include/Script || true
          [ -d "App/include/humanoid" ] && [ ! -e "App/include/Humanoid" ] && ln -s humanoid App/include/Humanoid || true
          [ -d "App/include/network" ] && [ ! -e "App/include/Network" ] && ln -s network App/include/Network || true
          [ -d "Rendering/g3d" ] && [ ! -e "Rendering/G3D" ] && ln -s g3d Rendering/G3D || true
          [ -d "Rendering/G3D/include/g3d" ] && [ ! -e "Rendering/G3D/include/G3D" ] && ln -s g3d Rendering/G3D/include/G3D || true

      - name: Create NDK 26 Compatibility Shims (sys/atomics.h)
        run: |
          mkdir -p android_port/shims/sys
          cat << 'EOF' > android_port/shims/sys/atomics.h
          #pragma once
          #include <stdint.h>

          #ifdef __cplusplus
          extern "C" {
          #endif

          static inline int __atomic_cmpxchg(int old_val, int new_val, volatile int* ptr) {
              return __sync_val_compare_and_swap(ptr, old_val, new_val);
          }

          static inline int __atomic_inc(volatile int* ptr) {
              return __sync_fetch_and_add(ptr, 1);
          }

          static inline int __atomic_dec(volatile int* ptr) {
              return __sync_fetch_and_sub(ptr, 1);
          }

          static inline int __atomic_swap(int new_val, volatile int* ptr) {
              return __sync_lock_test_and_set(ptr, new_val);
          }

          #ifdef __cplusplus
          }
          #endif
          EOF

      - name: Patch Win32 StringConv.cpp for Android
        run: |
          if [ -f "ClientShared/StringConv.cpp" ]; then
            cat << 'EOF' > ClientShared/StringConv.cpp
          #include "StringConv.h"
          #include <codecvt>
          #include <locale>
          #include <string>

          namespace RBX {
              std::string utf8_encode(const std::wstring& wstr) {
                  if (wstr.empty()) return std::string();
                  std::wstring_convert<std::codecvt_utf8_utf16<wchar_t>> conv;
                  return conv.to_bytes(wstr);
              }

              std::wstring utf8_decode(const std::string& str) {
                  if (str.empty()) return std::wstring();
                  std::wstring_convert<std::codecvt_utf8_utf16<wchar_t>> conv;
                  return conv.from_bytes(str);
              }
          }
          EOF
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        env:
          ROOT_DIR: ${{ github.workspace }}
        run: |
          # Passa os caminhos de include extra diretamente para o CMake via Gradle
          EXTRA_INCLUDES="-I${ROOT_DIR} -I${ROOT_DIR}/android_port/shims -I${ROOT_DIR}/third_party/boost -I${ROOT_DIR}/App/include -I${ROOT_DIR}/ClientShared -I${ROOT_DIR}/Log/include -I${ROOT_DIR}/Rendering/G3D/include -I${ROOT_DIR}/Network/include"
          
          ./gradlew assembleDebug \
            -Pandroid.ndkVersion=26.1.10909125 \
            -DCMAKE_CXX_FLAGS="${EXTRA_INCLUDES} -std=c++14 -fpermissive -Wno-everything" \
            -DCMAKE_C_FLAGS="${EXTRA_INCLUDES} -Wno-everything" \
            --stacktrace

      - name: Upload Generated APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
