name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK 26
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Prepare Boost, Symlinks & NDK Shims
        run: |
          # 1. Boost Headers (se ainda não estiverem no repo)
          if [ ! -d "third_party/boost/boost" ]; then
            mkdir -p third_party/boost
            curl -sL https://archives.boost.io/release/1.58.0/source/boost_1_58_0.tar.bz2 -o boost.tar.bz2
            tar -xjf boost.tar.bz2 -C third_party/boost --strip-components=1 boost_1_58_0/boost
            rm boost.tar.bz2
          fi

          # 2. Symlinks para case-sensitivity do Linux
          [ -d "App/include/v8tree" ] && [ ! -e "App/include/V8Tree" ] && ln -s v8tree App/include/V8Tree || true
          [ -d "App/include/util" ] && [ ! -e "App/include/Util" ] && ln -s util App/include/Util || true
          [ -d "App/include/reflection" ] && [ ! -e "App/include/Reflection" ] && ln -s reflection App/include/Reflection || true
          [ -d "App/include/rbx" ] && [ ! -e "App/include/Rbx" ] && ln -s rbx App/include/Rbx || true
          [ -d "App/include/v8datamodel" ] && [ ! -e "App/include/V8DataModel" ] && ln -s v8datamodel App/include/V8DataModel || true
          [ -d "App/include/v8world" ] && [ ! -e "App/include/V8World" ] && ln -s v8world App/include/V8World || true
          [ -d "App/include/v8xml" ] && [ ! -e "App/include/V8Xml" ] && ln -s v8xml App/include/V8Xml || true
          [ -d "App/include/security" ] && [ ! -e "App/include/Security" ] && ln -s security App/include/Security || true
          [ -d "App/include/script" ] && [ ! -e "App/include/Script" ] && ln -s script App/include/Script || true
          [ -d "App/include/humanoid" ] && [ ! -e "App/include/Humanoid" ] && ln -s humanoid App/include/Humanoid || true
          [ -d "App/include/network" ] && [ ! -e "App/include/Network" ] && ln -s network App/include/Network || true
          [ -d "Rendering/g3d" ] && [ ! -e "Rendering/G3D" ] && ln -s g3d Rendering/G3D || true
          [ -d "Rendering/G3D/include/g3d" ] && [ ! -e "Rendering/G3D/include/G3D" ] && ln -s g3d Rendering/G3D/include/G3D || true

          # 3. Shim sys/atomics.h para NDK 26
          mkdir -p android_port/shims/sys
          cat << 'EOF' > android_port/shims/sys/atomics.h
          #pragma once
          #ifdef __cplusplus
          extern "C" {
          #endif
          static inline int __atomic_cmpxchg(int o, int n, volatile int* p) { return __sync_val_compare_and_swap(p, o, n); }
          static inline int __atomic_inc(volatile int* p) { return __sync_fetch_and_add(p, 1); }
          static inline int __atomic_dec(volatile int* p) { return __sync_fetch_and_sub(p, 1); }
          static inline int __atomic_swap(int n, volatile int* p) { return __sync_lock_test_and_set(p, n); }
          #ifdef __cplusplus
          }
          #endif
          EOF

          # 4. Patch StringConv.cpp para Android
          if [ -f "ClientShared/StringConv.cpp" ]; then
            cat << 'EOF' > ClientShared/StringConv.
