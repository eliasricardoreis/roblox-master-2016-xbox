name: Build XboxUWPClient (Windows / UWP)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Configuration"
        default: "Release"
        type: choice
        options: [ Release, Debug ]
      platform:
        description: "Platform"
        default: "x64"
        type: choice
        options: [ x64, Win32, ARM ]

env:
  CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
  PLATFORM: ${{ github.event.inputs.platform || 'x64' }}
  # Pasta onde ficam as dependências (boost_1_56_0, SDL2.0.4, cpp-netlib, curl...).
  # O vcxproj usa $(CONTRIB_PATH). Ajuste se o seu repo usa outro caminho.
  CONTRIB_PATH: ${{ github.workspace }}\Contribs

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Localizar XboxUWPClient.sln / .vcxproj
        id: find
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Recurse -Filter XboxUWPClient.sln | Select-Object -First 1
          $proj = Get-ChildItem -Recurse -Filter XboxUWPClient.vcxproj | Select-Object -First 1
          if (-not $proj) { throw "XboxUWPClient.vcxproj não encontrado no repositório." }
          "sln=$($sln.FullName)"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "proj=$($proj.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "dir=$($proj.DirectoryName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Projeto: $($proj.FullName)"

      - name: Conferir dependências do código-fonte 2016
        shell: pwsh
        run: |
          # O vcxproj referencia pastas irmãs (..\App, ..\Base, ..\Network, ..\Rendering...)
          $root = (Get-Item "${{ steps.find.outputs.dir }}").Parent.FullName
          $need = 'App','Base','Network','Rendering','Log','ClientBase','ClientShared','AppBridge'
          $missing = $need | Where-Object { -not (Test-Path (Join-Path $root $_)) }
          if ($missing) {
            Write-Warning "Pastas ausentes ao lado de XboxUWPClient: $($missing -join ', '). O build vai falhar sem elas."
          }
          if (-not (Test-Path $env:CONTRIB_PATH)) {
            Write-Warning "CONTRIB_PATH ($env:CONTRIB_PATH) não existe. Coloque as Contribs no repo ou baixe-as em um passo antes."
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Detectar Windows SDK instalado
        id: sdk
        shell: pwsh
        run: |
          $inc = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          $ver = Get-ChildItem $inc -Directory |
                 Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
                 Sort-Object { [version]$_.Name } -Descending |
                 Select-Object -First 1 -ExpandProperty Name
          Write-Host "Windows SDK: $ver"
          "ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restaurar pacotes NuGet (Xbox Live SDK / GameChat)
        shell: pwsh
        run: |
          nuget restore "${{ steps.find.outputs.dir }}\packages.config" -PackagesDirectory "${{ steps.find.outputs.dir }}\..\packages"

      - name: Compilar
        shell: pwsh
        run: |
          # O projeto original usa v140 (VS2015) e SDK 14393; no runner usamos v143 + SDK mais novo.
          # PreBuildEvent (BuildCoreScripts.bat) desligado, como no NOPREBUILD=1 do build.bat local.
          msbuild "${{ steps.find.outputs.proj }}" `
            /m /restore `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=${{ steps.sdk.outputs.ver }} `
            /p:WindowsTargetPlatformMinVersion=10.0.14393.0 `
            /p:PreBuildEventUseInBuild=false `
            /p:CONTRIB_PATH="$env:CONTRIB_PATH" `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="${{ steps.find.outputs.dir }}\XboxUWPClient_TemporaryKey.pfx" `
            /p:AppxPackageDir="${{ github.workspace }}\out\AppPackages\" `
            /verbosity:minimal

      - name: Reunir saída
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem -Recurse -Include *.exe,*.dll,*.appx,*.msix,*.cer,*.pdb -Path . -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\$env:CONFIGURATION\\" -or $_.FullName -match 'AppPackages' } |
            Where-Object { $_.FullName -notmatch '\\packages\\' } |
            ForEach-Object { Write-Host $_.FullName }

      - name: Upload artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XboxUWPClient-${{ env.PLATFORM }}-${{ env.CONFIGURATION }}
          if-no-files-found: warn
          path: |
            out/AppPackages/**
            **/${{ env.CONFIGURATION }}/**/*.exe
            **/${{ env.CONFIGURATION }}/**/*.appx
            **/${{ env.CONFIGURATION }}/**/*.msix
            **/${{ env.CONFIGURATION }}/**/*.cer
