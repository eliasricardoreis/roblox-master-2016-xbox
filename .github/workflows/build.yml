name: Build Windows EXE (2016 Source)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Boost Headers
        uses: actions/cache@v4
        with:
          path: third_party/boost
          key: win-boost-1.58.0-v1

      - name: Download & Extract Boost Headers (1.58.0)
        shell: pwsh
        run: |
          if (-not (Test-Path "third_party/boost/boost")) {
            New-Item -ItemType Directory -Force -Path "third_party/boost" | Out-Null
            curl.exe -sL "https://archives.boost.io/release/1.58.0/source/boost_1_58_0.tar.bz2" -o "boost.tar.bz2"
            tar.exe -xjf "boost.tar.bz2" -C "third_party/boost" --strip-components=1 "boost_1_58_0/boost"
            Remove-Item -Force "boost.tar.bz2"
          }

      - name: Setup Visual Studio Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows Project
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $boostInc = "$root\third_party\boost"
          $extraInc = "$boostInc;$root;$root\App\include;$root\ClientShared;$root\Log\include;$root\Rendering\G3D\include;$root\Network\include"
          $env:INCLUDE = "$extraInc;$env:INCLUDE"

          $allSlns = Get-ChildItem -Path . -Filter "*.sln" -Recurse -Depth 5
          # Prioriza solution C++ principal se existir, senão pega a primeira disponível
          $sln = $allSlns | Where-Object { $_.Name -notmatch "CSharp" -and $_.Name -match "Client" } | Select-Object -First 1
          if (-not $sln) {
            $sln = $allSlns | Select-Object -First 1
          }

          if ($sln) {
            Write-Host "Compilando Solution: $($sln.FullName)"
            $slnContent = Get-Content -Path $sln.FullName -Raw
            $configs = [regex]::Matches($slnContent, '^\s*(Debug|Release)\|([^=\r\n]+)\s*=', 'Multiline') |
              ForEach-Object { "$($_.Groups[1].Value)|$($_.Groups[2].Value.Trim())" } |
              Select-Object -Unique

            Write-Host "Configuracoes encontradas na solution: $($configs -join ', ')"

            $chosen = $configs | Where-Object { $_ -match "^Release\|(x64|Any CPU|Win32|x86)$" } | Select-Object -First 1
            if (-not $chosen) {
              $chosen = $configs | Select-Object -First 1
            }

            if ($chosen) {
              $parts = $chosen.Split('|', 2)
              $cfg = $parts[0]
              $plat = $parts[1]
              Write-Host "Usando Configuration='$cfg' e Platform='$plat'"
              msbuild.exe "$($sln.FullName)" `
                "/p:Configuration=$cfg" `
                "/p:Platform=$plat" `
                /maxCpuCount:1 `
                /p:ForceImportBeforeCppTargets="" `
                /p:WarningLevel=0 `
                /p:TreatWarningsAsErrors=false
            } else {
              Write-Host "Usando configuracao padrao da solution"
              msbuild.exe "$($sln.FullName)" `
                /maxCpuCount:1 `
                /p:ForceImportBeforeCppTargets="" `
                /p:WarningLevel=0 `
                /p:TreatWarningsAsErrors=false
            }
          } else {
            $cmake = Get-ChildItem -Path . -Filter "CMakeLists.txt" -Recurse -Depth 5 | Select-Object -First 1
            if (-not $cmake) {
              Write-Error "Nenhum arquivo .sln ou CMakeLists.txt encontrado no repositório."
              exit 1
            }
            $srcDir = Split-Path $cmake.FullName
            $buildDir = "$root\build_win"
            New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
            Write-Host "Compilando via CMake em: $srcDir"
            cmake.exe -S "$srcDir" -B "$buildDir" -A x64 `
              -DCMAKE_CXX_FLAGS="/I`"$boostInc`" /permissive /w" `
              -DCMAKE_C_FLAGS="/I`"$boostInc`" /w"
            cmake.exe --build "$buildDir" --config Release --parallel 1
          }

      - name: Upload Built Windows Binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-release
          path: |
            **/*.exe
            **/*.dll
            !**/vcpkg/**
            !**/third_party/**
          if-no-files-found: error
