name: Build Android APK (2016 Source)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK & NDK 26
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Cache Boost Headers
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: third_party/boost
          key: boost-1.58.0-headers

      - name: Download & Extract Boost Headers (1.58.0)
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          mkdir -p third_party/boost
          curl -sL https://archives.boost.io/release/1.58.0/source/boost_1_58_0.tar.bz2 -o boost.tar.bz2
          tar -xjf boost.tar.bz2 -C third_party/boost --strip-components=1 boost_1_58_0/boost
          rm boost.tar.bz2

      - name: Fix Linux Case-Sensitivity & Create Shims
        run: |
          # 1. Symlinks para pastas em minúsculo
          for pair in \
            "App/include/v8tree:App/include/V8Tree" \
            "App/include/util:App/include/Util" \
            "App/include/reflection:App/include/Reflection" \
            "App/include/rbx:App/include/Rbx" \
            "App/include/v8datamodel:App/include/V8DataModel" \
            "App/include/v8world:App/include/V8World" \
            "App/include/v8xml:App/include/V8Xml" \
            "App/include/security:App/include/Security" \
            "App/include/script:App/include/Script" \
            "App/include/humanoid:App/include/Humanoid" \
            "App/include/network:App/include/Network" \
            "Rendering/g3d:Rendering/G3D" \
            "Rendering/G3D/include/g3d:Rendering/G3D/include/G3D"
          do
            SRC="${pair%%:*}"
            DST="${pair##*:}"
            [ -d "$SRC" ] && [ ! -e "$DST" ] && ln -s "$(basename "$SRC")" "$DST" || true
          done

          # 2. Shim sys/atomics.h para NDK 26
          mkdir -p android_port/shims/sys
          printf '%s\n' \
            '#pragma once' \
            '#ifdef __cplusplus' \
            'extern "C" {' \
            '#endif' \
            'static inline int __atomic_cmpxchg(int o, int n, volatile int* p) { return __sync_val_compare_and_swap(p, o, n); }' \
            'static inline int __atomic_inc(volatile int* p) { return __sync_fetch_and_add(p, 1); }' \
            'static inline int __atomic_dec(volatile int* p) { return __sync_fetch_and_sub(p, 1); }' \
            'static inline int __atomic_swap(int n, volatile int* p) { return __sync_lock_test_and_set(p, n); }' \
            '#ifdef __cplusplus' \
            '}' \
            '#endif' > android_port/shims/sys/atomics.h

          # 3. Patch StringConv.cpp para Android
          if [ -f "ClientShared/StringConv.cpp" ]; then
            printf '%s\n' \
              '#include "StringConv.h"' \
              '#include <codecvt>' \
              '#include <locale>' \
              '#include <string>' \
              'namespace RBX {' \
              '    std::string utf8_encode(const std::wstring& wstr) {' \
              '        if (wstr.empty()) return std::string();' \
              '        std::wstring_convert<std::codecvt_utf8_utf16<wchar_t>> conv;' \
              '        return conv.to_bytes(wstr);' \
              '    }' \
              '    std::wstring utf8_decode(const std::string& str) {' \
              '        if (str.empty()) return std::wstring();' \
              '        std::wstring_convert<std::codecvt_utf8_utf16<wchar_t>> conv;' \
              '        return conv.from_bytes(str);' \
              '    }' \
              '}' > ClientShared/StringConv.cpp
          fi

      - name: Build Debug APK
        env:
          ROOT_DIR: ${{ github.workspace }}
        run: |
          EXTRA_INCLUDES="-I${ROOT_DIR} -I${ROOT_DIR}/android_port/shims -I${ROOT_DIR}/third_party/boost -I${ROOT_DIR}/App/include -I${ROOT_DIR}/ClientShared -I${ROOT_DIR}/Log/include -I${ROOT_DIR}/Rendering/G3D/include -I${ROOT_DIR}/Network/include"

          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            cd "$(dirname "$GRADLEW_PATH")"
            chmod +x gradlew
            GRADLE_BIN="./gradlew"
          else
            BUILD_GRADLE=$(find . -maxdepth 3 \( -name "settings.gradle*" -o -name "build.gradle*" \) | head -n 1)
            if [ -z "$BUILD_GRADLE" ]; then
              echo "ERRO: Nenhum projeto Gradle encontrado no repositório!"
              ls -la
              exit 1
            fi
            cd "$(dirname "$BUILD_GRADLE")"
            GRADLE_BIN="gradle"
          fi

          $GRADLE_BIN assembleDebug \
            --parallel \
            --build-cache \
            -Pandroid.ndkVersion=26.1.10909125 \
            -DCMAKE_CXX_FLAGS="${EXTRA_INCLUDES} -std=c++14 -fpermissive -Wno-everything" \
            -DCMAKE_C_FLAGS="${EXTRA_INCLUDES} -Wno-everything" \
            --stacktrace

      - name: Upload Generated APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
